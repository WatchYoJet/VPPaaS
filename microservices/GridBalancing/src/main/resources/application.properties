quarkus.datasource.db-kind=mysql
quarkus.datasource.username=teste
quarkus.datasource.password=testeteste

quarkus.swagger-ui.path=swagger-ui
quarkus.swagger-ui.always-include=true

%prod.quarkus.container-image.build=true
%prod.quarkus.container-image.push=true
%prod.quarkus.container-image.docker.buildx.platform=linux/amd64,linux/arm64
%prod.quarkus.container-image.group=watchyojet
%prod.quarkus.datasource.reactive.url=mysql://placeholder:3306/VPPaaS
%prod.kafka.bootstrap.servers=placeholder:9092
%prod.telemetry.service.url=http://placeholder:8080
%prod.utilityoperator.service.url=http://placeholder:8080
%prod.assetlink.service.url=http://placeholder:8080
%prod.mp.messaging.incoming.energy-discharged-by-zone.connector=smallrye-kafka
%prod.mp.messaging.incoming.energy-discharged-by-zone.topic=energy-discharged-by-zone
%prod.mp.messaging.incoming.energy-discharged-by-zone.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
%prod.mp.messaging.incoming.energy-discharged-by-zone.group.id=grid-balancing-consumer
%prod.mp.messaging.incoming.energy-discharged-by-zone.auto.offset.reset=latest

%test.mp.messaging.incoming.energy-discharged-by-zone.enabled=false
%test.kafka.bootstrap.servers=localhost:9092
%test.telemetry.service.url=http://localhost:9999
%test.utilityoperator.service.url=http://localhost:9999
%test.assetlink.service.url=http://localhost:9999
